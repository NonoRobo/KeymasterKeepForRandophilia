      'Psychic',
      'Hunter',
      'Mage',
      'Tank',
      'Collarless',
      'Druid',
      'Fighter',
      'Monk',
      'Necromancer',
      'Tinkerer',
      'Butcher',
      'Jester',
      'Thief',
      'Cleric'
    ]
