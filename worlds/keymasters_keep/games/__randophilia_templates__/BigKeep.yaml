    [
      'Fire',
      'Ice',
      'Electric',
      'Wind',
      'Bless',
      'Curse',
      'Psychokinesis',
      'Nuke',
      'Physical'
    ]
  min_team_size_cap: 4
  max_role_exclusion_count: 2
  role_exclusion_include_navigator_role: 'true'
  role_exclusion_include_dps_roles: 'true'
  included_constraints: 
    [
      'None',
      '3 Stars',
      'Role Exclusion',
      'Element Team',
      'Team Size'
    ]
  included_base_objectives:
    [
      'Technician',
      'Other Velvet Trial',
      'Metro of Desire',
      'Recollection Boss'
    ]
  included_difficulties:
    [
      'Easy',
      'Medium'
    ]
    
  # Celeste (Niko)
  niko_celeste_include_core: 'false'
  niko_celeste_include_farewell: 'false'
  niko_celeste_include_b_side: 'false'
  niko_celeste_include_c_side: 'true'
  
  # CSD2 (Nono)
  csd2_max_yum: 79
  csd2_include_csd: 'true'
  csd2_include_c4h: 'true'
  
  # DSR (Niko)
  niko_dsr_include_aota: 'true'

  # Mewgenics (Nono)
