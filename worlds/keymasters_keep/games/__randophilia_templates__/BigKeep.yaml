      '[A1][C1] Alley',
      '[A1][C2] Junkyard',
      '[A1][C2] Sewers',
      '[A1][C3] Caves',
      '[A1][C3] Boneyard',
      '[A1][C4] Throbbing Domain',

      #'[A2][C1] Desert',
      #'[A2][C2] Bunker',
      #'[A2][C2] The Crater',
      #'[A2][C3] The Moon',
      #'[A2][C3] The Core',
      #'[A2][C4] The Rift',

      #'[A3][C1] The Lab',
      #'[A3][C2] The Future',
      #'[A3][C2] Ice Age',
      #'[A3][C3] The End',
